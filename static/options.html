<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BU for Bandcamp settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <header>
        <img src="icons/icon-96.png" alt="" width="36" height="36" />
        <span class="brand">BU for Bandcamp</span>
      </header>
      <h1>Settings</h1>
      <p class="intro">Changes apply right away, no reload needed.</p>
      <div class="settings">
        <label class="setting">
          <span>
            <span class="setting-title">Cart in the bottom player</span>
            <span class="setting-text">Show the add-to-cart button in the bottom player</span>
            <span class="setting-hint">Buys the track currently playing, at the price you set.</span>
          </span>
          <input type="checkbox" id="showCartButton" />
          <span class="switch" aria-hidden="true"></span>
        </label>
        <label class="setting">
          <span>
            <span class="setting-title">Cart on each track</span>
            <span class="setting-text">Show a price field and add-to-cart button on each track</span>
            <span class="setting-hint">Replaces the "buy track" links in an album's track list.</span>
          </span>
          <input type="checkbox" id="showTrackCartButtons" />
          <span class="switch" aria-hidden="true"></span>
        </label>
      </div>
    </main>
    <script src="options.js"></script>
  </body>
</html>
