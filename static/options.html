<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BU for Bandcamp Settings</title>
    <style>
      body {
        font-family: -apple-system, Helvetica, Arial, sans-serif;
        font-size: 14px;
        margin: 24px;
        max-width: 480px;
        color: #222;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 16px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }
      .hint {
        color: #666;
        margin: 4px 0 0 24px;
      }
    </style>
  </head>
  <body>
    <h1>BU for Bandcamp</h1>
    <label>
      <input type="checkbox" id="showCartButton" />
      Show the add-to-cart button in the bottom player
    </label>
    <p class="hint">Buys the track currently playing, at the price you set.</p>
    <script src="options.js"></script>
  </body>
</html>
