name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn package
        env:
          EXTENSION_VERSION: ${{ github.ref_name }}

      - name: Attach builds to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/chrome.zip
            dist/firefox.zip

      # Fails until the extension has been registered once in each store.
      - name: Publish to web stores
        uses: PlasmoHQ/bpp@v3
        with:
          keys: ${{ secrets.SUBMIT_KEYS }}
          chrome-file: dist/chrome.zip
          firefox-file: dist/firefox.zip
          edge-file: dist/chrome.zip
