name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: yarn typecheck

      # The version only lives in the tag, and Firefox reviewers rebuild from source.zip, so it
      # has to be in package.json for both the build and the source package.
      - name: Use the tag's version
        run: >
          node -e 'const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pkg.version = process.env.GITHUB_REF_NAME.replace(/^v/, "");
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");'

      - run: yarn package

      - name: Package the source for Firefox review
        run: git ls-files -z -- ':!docs' ':!store' ':!images' | xargs -0 zip -q dist/source.zip

      - name: Attach builds to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/chrome.zip
            dist/firefox.zip
            dist/source.zip

      # One secret per store: a store is published once its secret exists, and the others are skipped.
      # They stay separate because GitHub only hides exact secret values in logs, not pieces of one.
      - name: Check which stores are set up
        id: stores
        env:
          CHROME: ${{ secrets.SUBMIT_KEYS_CHROME }}
          FIREFOX: ${{ secrets.SUBMIT_KEYS_FIREFOX }}
          EDGE: ${{ secrets.SUBMIT_KEYS_EDGE }}
        run: |
          echo "chrome=$([ -n "$CHROME" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "firefox=$([ -n "$FIREFOX" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "edge=$([ -n "$EDGE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Publish to the Chrome Web Store
        if: steps.stores.outputs.chrome == 'true'
        uses: PlasmoHQ/bpp@v3
        with:
          keys: ${{ secrets.SUBMIT_KEYS_CHROME }}
          chrome-file: dist/chrome.zip

      - name: Publish to Firefox Add-ons
        if: steps.stores.outputs.firefox == 'true'
        uses: PlasmoHQ/bpp@v3
        with:
          keys: ${{ secrets.SUBMIT_KEYS_FIREFOX }}
          firefox-file: dist/firefox.zip
          source-file: dist/source.zip

      - name: Publish to Edge Add-ons
        if: steps.stores.outputs.edge == 'true'
        uses: PlasmoHQ/bpp@v3
        with:
          keys: ${{ secrets.SUBMIT_KEYS_EDGE }}
          edge-file: dist/chrome.zip
