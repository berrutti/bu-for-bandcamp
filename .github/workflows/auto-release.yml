name: Auto Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  release:
    if: >
      github.event.pull_request.merged == true &&
      (
        contains(github.event.pull_request.labels.*.name, 'release:patch') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:major')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Determine bump type
        id: bump
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if echo "$LABELS" | grep -q "release:major"; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q "release:minor"; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      # main is protected, so the version lives in the tags instead of a package.json commit.
      - name: Work out the next version
        id: version
        env:
          BUMP: ${{ steps.bump.outputs.type }}
        run: |
          export LATEST_TAG="$(git tag --list 'v*.*.*' --sort=-v:refname | head -n 1)"
          NEXT=$(node -e '
            const parse = (v) => v.replace(/^v/, "").split(".").map(Number);
            const newer = (a, b) => (a[0] - b[0] || a[1] - b[1] || a[2] - b[2]) > 0 ? a : b;
            const fromTag = parse(process.env.LATEST_TAG || "v0.0.0");
            const fromPackage = parse(require("./package.json").version);
            const [major, minor, patch] = newer(fromTag, fromPackage);
            const next = { major: [major + 1, 0, 0], minor: [major, minor + 1, 0], patch: [major, minor, patch + 1] };
            console.log(next[process.env.BUMP].join("."));
          ')
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Tag the release
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      # A tag pushed with the built-in token doesn't trigger release.yml, but a dispatch does.
      - name: Start the release build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run release.yml --ref "v${{ steps.version.outputs.version }}"
